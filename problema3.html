<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num1;
        let num2;
        let num3;
        let num4;
        
        num1 = prompt('Introduce primer valor:');
        num2 = prompt('Introduce segundo valor:');
        num3 = prompt('Introduce tercer valor:');
        num4 = prompt('Introduce cuarto valor:');
    
        let suma;
        suma = parseInt(num1)+parseInt(num2)+parseInt(num3)+parseInt(num4);
        let producto;
        producto = parseInt(num1)*parseInt(num2)*parseInt(num3)*parseInt(num4);
        document.write('La suma de las 4 variables es: ');
        document.write(suma);
        document.write('<br>');
        document.write('El producto de las 4 variables es: ');
        document.write(producto);
    </script>
</body>
</html>
