<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let precio;
        let cantidad;
        precio = prompt('Ingresar precio del articulo:');
        cantidad = prompt('Ingrese la cantidad de articulos a llevar:');
        let importe;
        importe = parseInt(precio)*parseInt(cantidad);
        document.write('Debe abonar: $'+importe+' .- ');
    </script>
</body>
</html>
