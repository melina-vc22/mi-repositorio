<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num1;
         let num2;
         let num3;
         let num4;
         num1 = prompt('Ingresa primer valor:');
         num2 = prompt('Ingresa segundo valor:');
         num3 = prompt('Ingresa tercer valor:');
         num4 = prompt('Ingresa cuarto valor:');

         let suma;
         suma = parseInt(num1)+parseInt(num2);
         let producto;
         producto = parseInt(num3)*parseInt(num4);
         document.write('La suma de los 2 primeros valores es: ');
         document.write(suma);
         document.write('<br>');
         document.write('El producto del tercer y cuarto valores es: ');
         document.write(producto);
    </script>
</body>
</html>
